name: Gate

# The deterministic gate on every pull request, and on main for the changes release.yml does not
# watch. release.yml only runs when src/, icons/ or build.ps1 change, so without this a broken
# scripts/check.ps1 or a broken template would land with nothing having executed it.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "dotnet-tools.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Provide Dalamud assemblies
        shell: pwsh
        run: |
          # Dalamud.NET.Sdk resolves Dalamud.dll from DALAMUD_HOME (or a local install).
          # A fresh runner has neither, so unpack the public build.
          $zip = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          $dest = Join-Path $env:RUNNER_TEMP "dalamud"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest "Dalamud.dll"))) {
            throw "Dalamud.dll missing after unpacking the distribution"
          }
          "DALAMUD_HOME=$dest" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Restore the preview tool
        run: dotnet tool restore

      - name: Gate every plugin
        shell: pwsh
        run: ./scripts/check-all.ps1

      - name: Upload preview diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-diffs
          path: artifacts/previews
          if-no-files-found: warn
